  const b = bounds(K.value);
  const p = [...pointers.values()][0];
  gesture.start = {px:p.x, py:p.y, rx:unrband(X.value,b.x0,b.x1,b.w), ry:unrband(Y.value,b.y0,b.y1,b.h)};
  gesture.track.reset(); gesture.track.push(p.x, p.y);
}
function beginPinch(){
  const [a,b] = [...pointers.values()], r = stage.getBoundingClientRect();
  const mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top;
  gesture.pinch = {d0: Math.hypot(a.x-b.x, a.y-b.y) || 1, k0: K.value, wx:(mx-X.value)/K.value, wy:(my-Y.value)/K.value};
  gesture.moved = true;
}
stage.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  anchor = null; X.stop(); Y.stop(); K.stop();
  if (pointers.size === 1) {
    gesture.moved = false;
    gesture.pressed = e.target.closest(".node");
    if (gesture.pressed) gesture.pressed.classList.add("press");
    beginPan();
  } else if (pointers.size === 2) { beginPinch(); }
});
stage.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const r = stage.getBoundingClientRect();
  if (pointers.size >= 2 && gesture.pinch) {
    const [a,b] = [...pointers.values()];
    const k = rband(gesture.pinch.k0 * Math.hypot(a.x-b.x, a.y-b.y)/gesture.pinch.d0, K_MIN, K_MAX, 1);
    const mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top;
    K.set(k); X.set(mx - gesture.pinch.wx*k); Y.set(my - gesture.pinch.wy*k); apply();
    return;
  }
  const s0 = gesture.start; if (!s0) return;
  const dx = e.clientX - s0.px, dy = e.clientY - s0.py;
  if (!gesture.moved && Math.hypot(dx,dy) < SLOP) return;
  if (!gesture.moved) { gesture.moved = true; stage.classList.add("drag"); gesture.pressed?.classList.remove("press"); }
  const b = bounds(K.value);
  X.set(rband(s0.rx + dx, b.x0, b.x1, b.w)); Y.set(rband(s0.ry + dy, b.y0, b.y1, b.h)); apply();
  gesture.track.push(e.clientX, e.clientY);
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  gesture.pressed?.classList.remove("press");
  if (gesture.pinch && pointers.size < 2) {
    gesture.pinch = null;
    const r = stage.getBoundingClientRect(), rest = [...pointers.values()][0];
    if (K.value < K_MIN || K.value > K_MAX) zoomTo(K.value, rest ? rest.x-r.left : r.width/2, rest ? rest.y-r.top : r.height/2, {zeta:1, response:.35});
    if (rest) { beginPan(); return; }
    if (!anchor) settle();
    return;
  }
  if (pointers.size === 0) {
    stage.classList.remove("drag");
    const v = gesture.moved ? gesture.track.velocity() : {x:0,y:0};
    gesture.start = null;
    if (gesture.moved) settle(v.x, v.y);
    else if (e.type === "pointerup") {
      if (gesture.pressed) select(gesture.pressed.dataset.id, {reveal:true}); else select(null);
    }
    gesture.pressed = null;
  }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

stage.tabIndex = 0;
stage.setAttribute("aria-label", "Server map. Arrow keys pan, plus and minus zoom, 0 fits.");
stage.addEventListener("keydown", e => {
  const step = e.shiftKey ? 240 : 80;
  const m = {ArrowLeft:[step,0], ArrowRight:[-step,0], ArrowUp:[0,step], ArrowDown:[0,-step]}[e.key];
  if (m) { e.preventDefault(); anchor=null; X.to(X.target+m[0], {response:.3}); Y.to(Y.target+m[1], {response:.3}); return; }
  if (e.key==="+" || e.key==="=") zoomTo((anchor?K.target:K.value)*1.25);
  else if (e.key==="-") zoomTo((anchor?K.target:K.value)/1.25);
  else if (e.key==="0") fit();
});
document.addEventListener("keydown", e => { if (e.key==="Escape") select(null); });

$("#fit").onclick = () => fit();
$("#zin").onclick = () => zoomTo((anchor?K.target:K.value)*1.3);
$("#zout").onclick = () => zoomTo((anchor?K.target:K.value)/1.3);
$("#theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.classList.add("theming");
  r.dataset.theme = dark ? "light" : "dark";
  setTimeout(() => r.classList.remove("theming"), 320);
};
document.addEventListener("touchstart", () => {}, {passive:true}); // enables :active press states on iOS

const sheet = (() => {
  const aside = $("aside"), grip = $("#grip"), mq = matchMedia("(max-width:760px)");
  const S = new Spring(0, .5);
  let drag = null; const track = tracker();
  const OVER = 80; // the sheet extends below the screen so an overshoot never reveals a gap
  const height = () => aside.getBoundingClientRect().height - OVER;
  const detents = () => { const h = height(); return {full:0, half:Math.round(h*.45), peek:Math.max(0, h-96)}; };
  const draw = () => { if (mq.matches) aside.style.transform = `translate3d(0,${S.value}px,0)`; };
  frameHooks.push(draw);
  function layout(){
    if (!mq.matches) { aside.style.transform = ""; S.set(0); return; }
    S.set(detents().peek); draw();
  }
  function snapTo(name, velocity=0){ S.to(detents()[name], {zeta:.8, response:.3, velocity}); }
  grip.addEventListener("pointerdown", e => {
    if (!mq.matches) return;
    grip.setPointerCapture(e.pointerId);
    S.stop();
    const d = detents();
    drag = {y0:e.clientY, v0:unrband(S.value, d.full, d.peek, height()), moved:false};
    track.reset(); track.push(0, e.clientY);
  });
  grip.addEventListener("pointermove", e => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    if (!drag.moved && Math.abs(dy) < SLOP) return;
    drag.moved = true;
    const d = detents();
    S.set(rband(drag.v0 + dy, d.full, d.peek, height())); draw();
    track.push(0, e.clientY);
  });
  function release(e){
    if (!drag) return;
    const d = detents(), wasDrag = drag.moved; drag = null;
    if (!wasDrag) { snapTo(S.value > d.half + 4 ? "half" : "peek"); return; }
    const v = track.velocity().y;
    const projected = S.value + project(v, .99);
    const name = Object.entries(d).sort((a,b) => Math.abs(a[1]-projected) - Math.abs(b[1]-projected))[0][0];
    snapTo(name, v);
  }
  grip.addEventListener("pointerup", release);
  grip.addEventListener("pointercancel", release);
  grip.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") { e.preventDefault(); const d=detents(); snapTo(S.target > d.half+4 ? "half" : "peek"); } });
  mq.addEventListener("change", () => { layout(); fit(false); });
  return {
    layout,
    reveal(){ if (mq.matches && S.target > detents().half) snapTo("half"); },
    covered(){ return mq.matches ? Math.max(0, height() - S.target) : 0; },
    mobile(){ return mq.matches; },
  };
})();

window.addEventListener("resize", () => { sheet.layout(); fit(false); });
sheet.layout();
fit(false);
</script>
</body>
</html>
