upstream app { server web:80; }

server {
  listen 80;
  server_name shop.test;            # planted: served over plain HTTP
  location / { proxy_pass http://app; }
  location /legacy/ { proxy_pass http://10.255.255.1:9000; }   # planted: nothing runs there
}

server {
  listen 80;
  server_name secure.test;
  return 301 https://$host$request_uri;
}
